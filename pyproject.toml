[project]
name = "analslack"
version = "0.1.0"
description = "Slack #team-sales 채널의 사업별 공유 스레드를 수집/취합/분석하는 도구"
requires-python = ">=3.10"
dependencies = [
    "slack_sdk>=3.27",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
prod = ["gunicorn>=21"]

[project.scripts]
analslack = "analslack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analslack = ["templates/*.html"]
